<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>News App</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#000;
    color:#fff;
    font-family:Arial,sans-serif;
    overflow:hidden;
}

/* Start Screen */
#startScreen{
    position:fixed;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#000;
    z-index:9999;
}

#fullscreenBtn{
    width:90px;
    height:90px;
    border:none;
    border-radius:50%;
    font-size:38px;
    cursor:pointer;
}

/* Main App */
#app{
    display:none;
    width:100vw;
    height:100vh;
    position:relative;
}

/* Instagram Style Full Screen Frame */
.frame{
    width:100%;
    height:100%;
    position:relative;
    overflow:hidden;
}

#mediaContainer{
    width:100%;
    height:100%;
}

#mediaContainer img,
#mediaContainer video{
    width:100%;
    height:100%;
    object-fit:cover;
}

/* News Overlay */
.news-content{
    position:absolute;
    left:15px;
    right:15px;
    bottom:80px;
    background:rgba(0,0,0,0.45);
    padding:12px;
    border-radius:12px;
}

.news-content h2{
    margin-bottom:8px;
}

/* Bottom Navigation */
.bottom-nav{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    height:60px;
    background:rgba(0,0,0,.85);
    display:flex;
    justify-content:space-around;
    align-items:center;
    border-top:1px solid rgba(255,255,255,.1);
}

.bottom-nav a{
    color:#fff;
    text-decoration:none;
    font-size:14px;
}
</style>
</head>
<body>

<div id="startScreen">
    <button id="fullscreenBtn">⛶</button>
</div>

<div id="app">

    <div class="frame">

        <div id="mediaContainer"></div>

        <div class="news-content">
            <h2>Breaking News</h2>
            <p>Latest news updates will appear here.</p>
        </div>

        <div class="bottom-nav">
            <a href="#">🏠 Home</a>
            <a href="#">🎥 Videos</a>
            <a href="#">📂 Category</a>
            <a href="#">👤 Account</a>
        </div>

    </div>

</div>

<script>

/* Put your Cloudinary media here */
const allMedia = [
{
type:"image",
url:"https://res.cloudinary.com/demo/image/upload/sample.jpg"
},
{
type:"video",
url:"https://res.cloudinary.com/demo/video/upload/dog.mp4"
}
];

const btn = document.getElementById("fullscreenBtn");
const app = document.getElementById("app");
const startScreen = document.getElementById("startScreen");
const mediaContainer = document.getElementById("mediaContainer");

let currentIndex = 0;

function showMedia(index){

    const item = allMedia[index];

    if(item.type === "image"){
        mediaContainer.innerHTML = `
            <img src="${item.url}" alt="">
        `;
    }

    if(item.type === "video"){
        mediaContainer.innerHTML = `
            <video autoplay muted loop playsinline>
                <source src="${item.url}" type="video/mp4">
            </video>
        `;
    }
}

btn.addEventListener("click", async ()=>{

    try{
        await document.documentElement.requestFullscreen();
    }catch(e){}

    startScreen.style.display="none";
    app.style.display="block";

    showMedia(currentIndex);
});

/* Swipe Up / Down */

let startY = 0;

document.addEventListener("touchstart",(e)=>{
    startY = e.touches[0].clientY;
});

document.addEventListener("touchend",(e)=>{

    let endY = e.changedTouches[0].clientY;
    let diff = startY - endY;

    if(Math.abs(diff) < 50) return;

    if(diff > 0){
        currentIndex++;
        if(currentIndex >= allMedia.length){
            currentIndex = 0;
        }
    }else{
        currentIndex--;
        if(currentIndex < 0){
            currentIndex = allMedia.length - 1;
        }
    }

    showMedia(currentIndex);
});

</script>

</body>
</html>
