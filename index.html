<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>News Feed</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:Arial,sans-serif;}
#app{width:100vw;height:100vh;position:relative;overflow:hidden;}
.logo{position:fixed;top:15px;left:15px;z-index:1000;color:#fff;font-size:24px;font-weight:bold;}
#mediaContainer{
position:fixed;top:0;left:0;right:0;bottom:65px;
display:flex;justify-content:center;align-items:center;background:#000;
}
.media-frame{height:100%;aspect-ratio:9/16;overflow:hidden;background:#000;}
.media-frame img,.media-frame video{width:100%;height:100%;object-fit:cover;display:block;}
.bottom-nav{
position:fixed;bottom:0;left:0;width:100%;height:65px;
background:rgba(0,0,0,.75);
display:flex;justify-content:space-around;align-items:center;
}
.bottom-nav a{color:#fff;text-decoration:none;font-size:12px;text-align:center;}
.bottom-nav span{display:block;font-size:22px;}
</style>
</head>
<body>
<div id="app">
<div class="logo">NEWS</div>
<div id="mediaContainer"></div>

<nav class="bottom-nav">
<a href="#"><span>🏠</span>Home</a>
<a href="#"><span>🎥</span>Videos</a>
<a href="#"><span>📂</span>Categories</a>
<a href="#"><span>👤</span>Account</a>
</nav>
</div>

<script>
const allMedia = [
{
type:"image",
url:"https://res.cloudinary.com/dujoufris/image/upload/v1781711779/file_00000000aa3071fa9a302b75ebfe6ef7_dltshu.png"
},
{
type:"video",
url:"https://res.cloudinary.com/dujoufris/video/upload/v1781713943/VID_20260617_090426_628_dm00bf.mp4"
}
];

let currentIndex = 0;
const mediaContainer = document.getElementById("mediaContainer");

function showMedia(index){
const item = allMedia[index];

if(item.type === "image"){
mediaContainer.innerHTML = `
<div class="media-frame">
<img src="${item.url}" alt="">
</div>`;
}else{
mediaContainer.innerHTML = `
<div class="media-frame">
<video autoplay muted loop playsinline>
<source src="${item.url}" type="video/mp4">
</video>
</div>`;
}
}

showMedia(0);

let startY = 0;
document.addEventListener("touchstart",(e)=>{
startY = e.touches[0].clientY;
});

document.addEventListener("touchend",(e)=>{
let endY = e.changedTouches[0].clientY;
let diff = startY - endY;

if(Math.abs(diff) < 50) return;

if(diff > 0){
currentIndex = (currentIndex + 1) % allMedia.length;
}else{
currentIndex = (currentIndex - 1 + allMedia.length) % allMedia.length;
}

showMedia(currentIndex);
});
</script>
</body>
</html>
